services:
  nexora:
    image: ${NEXORA_QA_IMAGE:-${NEXORA_GPU_IMAGE:-nexora-qa:gpu-20261005}}
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    environment:
      NEXORA_DEVICE: cuda
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
